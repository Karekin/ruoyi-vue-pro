name: Build and Push Docker Image (multi-arch)

on:
  push:
    branches: [ master-jdk17-0912cloud ]                         # 如默认分支是 main 就改成 main
    paths:
      - 'yudao-server/**'
      - 'pom.xml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write                                # 给 GHCR 用；若只推 Docker Hub 保留也不影响

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 多架构需要 QEMU
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # 登录 Docker Hub（需要 Secrets: DOCKER_USERNAME / DOCKER_PASSWORD(token)）
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 可选：同时推到 GHCR（用内置 GITHUB_TOKEN，省心）
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push (amd64 + arm64)
        uses: docker/build-push-action@v6
        with:
          context: .                              # 仓库根
          file: yudao-server/Dockerfile           # 子模块的 Dockerfile（多阶段、JDK17）
          platforms: linux/amd64,linux/arm64      # 关键：多架构
          push: true
          tags: |                                 # 决定镜像名和 tag
            ${{ secrets.DOCKER_USERNAME }}/yudao-server:latest
            ${{ secrets.DOCKER_USERNAME }}/yudao-server:${{ github.sha }}
            ghcr.io/${{ toLower(github.repository_owner) }}/ruoyi-vue-pro:server
            ghcr.io/${{ toLower(github.repository_owner) }}/ruoyi-vue-pro:server-${{ github.sha }}
          cache-from: type=gha                    # GHA 缓存提速（支持多平台）
          cache-to: type=gha,mode=max
