name: Build and Push Docker Image (amd64-only) and deploy

on:
  push:
    branches: [ master-jdk17-0912cloud ]
    paths:
      - 'yudao-server/**'
      - 'pom.xml'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 只做 amd64，不需要 QEMU
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: yudao-server/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/yudao-server:latest
            ${{ secrets.DOCKER_USERNAME }}/yudao-server:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false         # 关掉溯源元数据，略提速
  deploy:
    needs: build-image
    runs-on: ubuntu-latest
    if: github.repository == 'karekin/ruoyi-vue-pro'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - uses: actions-hub/kubectl@master
        env:
          KUBE_CONFIG: ${{ secrets.KUBE_CONFIG }}
        with:
          args: rollout restart deployment yudao-server
